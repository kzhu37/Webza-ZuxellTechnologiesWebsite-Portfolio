<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Spring 2026 implementation evolution</title>
  <desc id="desc">Three-stage diagram showing the March 9 first complete Zuxell build, the post-March-Break feedback period, and the April 3 revision that separated structure, styling, and interaction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#07101a"/>
      <stop offset="1" stop-color="#0d1c29"/>
    </linearGradient>
    <style>
      .heading { font: 700 26px Arial, sans-serif; fill: #edf5fb; }
      .sub { font: 400 14px Arial, sans-serif; fill: #a8bac8; }
      .kicker { font: 700 12px Arial, sans-serif; fill: #83d176; letter-spacing: 1.2px; }
      .title { font: 700 19px Arial, sans-serif; fill: #edf5fb; }
      .copy { font: 400 14px Arial, sans-serif; fill: #a8bac8; }
      .metric { font: 700 13px Arial, sans-serif; fill: #6fc8f5; }
      .mono { font: 700 13px monospace; fill: #edf5fb; }
      .card { fill: #101f2d; stroke: #2a4357; stroke-width: 2; }
      .arrow { stroke: #6fc8f5; stroke-width: 3; fill: none; }
      .tag { font: 700 11px Arial, sans-serif; fill: #6fc8f5; letter-spacing: 0.7px; }
      .pill { fill: #0b1724; stroke: #2a4357; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <text x="60" y="58" class="heading">Spring 2026 implementation evolution</text>
  <text x="60" y="83" class="sub">Retained source checkpoints show how client feedback changed both the experience and the implementation.</text>

  <rect x="55" y="125" width="315" height="325" rx="20" class="card"/>
  <text x="80" y="158" class="kicker">MARCH 9, 2026</text>
  <text x="80" y="190" class="title">First complete client build</text>
  <text x="80" y="229" class="mono">index.html</text>
  <text x="80" y="253" class="metric">about 87 KB</text>
  <text x="80" y="293" class="copy">Most structure, styling, and</text>
  <text x="80" y="314" class="copy">interaction lived together in</text>
  <text x="80" y="335" class="copy">one large HTML file.</text>
  <rect x="80" y="395" width="166" height="26" rx="13" class="pill"/>
  <text x="94" y="413" class="tag">ORIGINAL SPRING SOURCE</text>

  <path d="M390 287 H430" class="arrow"/>
  <path d="M420 277 L432 287 L420 297" class="arrow"/>

  <rect x="445" y="125" width="315" height="325" rx="20" class="card"/>
  <text x="470" y="158" class="kicker">AFTER MARCH BREAK</text>
  <text x="470" y="190" class="title">Feedback changed the target</text>
  <text x="470" y="229" class="copy">Clarify unclear sections.</text>
  <text x="470" y="253" class="copy">Polish the visual direction.</text>
  <text x="470" y="277" class="copy">Strengthen the landing page.</text>
  <text x="470" y="316" class="metric">Build Webza in parallel</text>
  <text x="470" y="339" class="metric">Coordinate changing availability</text>
  <rect x="470" y="395" width="166" height="26" rx="13" class="pill"/>
  <text x="484" y="413" class="tag">PROJECT NOTES</text>

  <path d="M780 287 H820" class="arrow"/>
  <path d="M810 277 L822 287 L810 297" class="arrow"/>

  <rect x="835" y="125" width="310" height="325" rx="20" class="card"/>
  <text x="860" y="158" class="kicker">APRIL 3, 2026</text>
  <text x="860" y="190" class="title">Separated concerns, revised experience</text>
  <text x="860" y="227" class="mono">index.html   structure</text>
  <text x="860" y="251" class="mono">style.css    visual system</text>
  <text x="860" y="275" class="mono">script.js    interaction</text>
  <text x="860" y="314" class="metric">1,516 HTML lines changed</text>
  <text x="860" y="337" class="metric">911 CSS lines added</text>
  <text x="860" y="360" class="metric">245 JS lines added</text>
  <rect x="860" y="395" width="166" height="26" rx="13" class="pill"/>
  <text x="874" y="413" class="tag">ORIGINAL SPRING SOURCE</text>

  <text x="60" y="488" class="sub">The counts show revision scale. The engineering change was cleaner separation while the client experience was being refined.</text>
</svg>
