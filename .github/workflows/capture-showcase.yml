name: Capture showcase assets

on:
  push:
    branches: [main]
    paths:
      - "tools/capture-showcase.js"
      - ".github/workflows/capture-showcase.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture current showcase
        run: node tools/capture-showcase.js
      - name: Commit current captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots/zuxell-home-current.png
          git add docs/assets/screenshots/zuxell-services-current-mobile.png
          git add docs/assets/screenshots/zuxell-contact-current-mobile.png
          git add docs/assets/social-preview.png
          if git diff --cached --quiet; then
            echo "Showcase captures are already current"
          else
            git commit -m "Refresh current showcase captures [skip ci]"
            git push
          fi
