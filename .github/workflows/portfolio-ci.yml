name: Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Chrome for CI
        run: |
          cat > "$RUNNER_TEMP/chrome-ci" <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/google-chrome --no-sandbox --disable-dev-shm-usage "$@"
          EOF
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "CHROME_PATH=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"

      - name: Run syntax checks
        run: npm run check

      - name: Run server smoke tests
        run: npm run test:server

      - name: Run browser smoke tests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Browser test attempt $attempt of 3"
            if npm run test:browser; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Chrome did not complete the run. Retrying after a short delay."
              sleep 2
            fi
          done
          exit 1
