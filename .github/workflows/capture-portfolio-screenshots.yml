name: Capture portfolio screenshots

on:
  push:
    branches:
      - portfolio-admissions-refresh
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Chrome for CI
        run: |
          cat > "$RUNNER_TEMP/chrome-ci" <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/google-chrome --no-sandbox "$@"
          EOF
          chmod +x "$RUNNER_TEMP/chrome-ci"
          echo "CHROME_PATH=$RUNNER_TEMP/chrome-ci" >> "$GITHUB_ENV"

      - name: Validate project and capture browser screenshots
        run: npm test

      - name: Copy portfolio screenshots
        run: |
          mkdir -p docs/assets/screenshots
          cp /tmp/zuxell-home-desktop.png docs/assets/screenshots/home-desktop.png
          cp /tmp/zuxell-services-mobile.png docs/assets/screenshots/services-mobile.png
          cp /tmp/zuxell-contact-mobile.png docs/assets/screenshots/contact-mobile.png

      - name: Commit generated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
          else
            git commit -m "docs: capture portfolio screenshots"
            git push
          fi
